
name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q AIDnsSwitcher-github-ready.zip -d .
          test -d AIDnsSwitcher
          
      - name: Set Android build compatibility
        working-directory: AIDnsSwitcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          if not path.is_file():
              raise SystemExit("Gradle file not found")

          source = path.read_text()

          source, count = re.subn(
              r"(?m)^([ \t]*minSdk[ \t]*=[ \t]*)\d+([ \t]*)$",
              r"\g<1>29\g<2>",
              source,
          )
          if count != 1:
              raise SystemExit(f"Expected one minSdk declaration, found {count}")

          blocks = {
              "compileOptions": """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
              "kotlinOptions": """    kotlinOptions {
                  jvmTarget = "17"
              }""",
          }

          for name, block in blocks.items():
              pattern = re.compile(
                  rf"(?ms)^    {name}[ \t]*\{{.*?^    \}}"
              )
              if pattern.search(source):
                  source = pattern.sub(block, source, count=1)
              else:
                  marker = "android {\n"
                  if marker not in source:
                      raise SystemExit("Android configuration block not found")
                  source = source.replace(
                      marker, marker + block + "\n", 1
                  )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in source:
              raise SystemExit("Java source target verification failed")
          if 'jvmTarget = "17"' not in source:
              raise SystemExit("Kotlin target verification failed")
          if not re.search(r"(?m)^[ \t]*minSdk[ \t]*=[ \t]*29[ \t]*$", source):
              raise SystemExit("Minimum SDK verification failed")

          path.write_text(source)
          print("Android API: 29")
          print("Java JVM target: 17")
          print("Kotlin JVM target: 17")
          PY
          
      - name: Fix OkHttp DNS implementation
        working-directory: AIDnsSwitcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/ru/aidnsswitcher/app/DnsProbe.kt")
          source = path.read_text()

          old = '''            .dns { requestedHost ->
                val ips = if (requestedHost.equals(host, ignoreCase = true)) {
                    knownAddresses
                } else {
                    queryA(dohUrl, requestedHost)
                }
                if (ips.isEmpty()) throw UnknownHostException("Нет A-записи для $requestedHost")
                ips.map { InetAddress.getByName(it) }
            }'''

          new = '''            .dns(object : okhttp3.Dns {
                override fun lookup(hostname: String): List<InetAddress> {
                    val ips = if (hostname.equals(host, ignoreCase = true)) {
                        knownAddresses
                    } else {
                        queryA(dohUrl, hostname)
                    }
                    if (ips.isEmpty()) throw UnknownHostException("Нет A-записи для $hostname")
                    return ips.map { InetAddress.getByName(it) }
                }
            })'''

          if source.count(old) == 1:
              source = source.replace(old, new)
              path.write_text(source)
              print("OkHttp DNS implementation patched")
          elif new in source:
              print("OkHttp DNS implementation already patched")
          else:
              raise SystemExit("Expected DNS implementation not found; build stopped")
          PY
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AIDnsSwitcher
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-DNS-Switcher-debug-apk
          path: AIDnsSwitcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
