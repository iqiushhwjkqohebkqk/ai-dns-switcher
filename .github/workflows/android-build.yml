
name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q AIDnsSwitcher-github-ready.zip -d .
          test -d AIDnsSwitcher
          
      - name: Set minimum Android version
        working-directory: AIDnsSwitcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path("app").glob("build.gradle*"))
          if not files:
              raise SystemExit("App Gradle file not found")

          pattern = re.compile(
              r"(?m)^([ \t]*minSdk(?:Version)?[ \t]*(?:=[ \t]*)?)(\d+)([ \t]*(?://.*)?$)"
          )

          total = 0
          for path in files:
              source = path.read_text()
              updated, count = pattern.subn(
                  lambda m: m.group(1) + str(max(29, int(m.group(2)))) + m.group(3),
                  source
              )
              if count:
                  path.write_text(updated)
                  total += count
                  print(f"Updated {path}: {count} declaration(s)")

          if total == 0:
              raise SystemExit("No numeric minSdk declaration found; build stopped safely")

          print("Minimum Android version is now at least API 29")
          PY
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AIDnsSwitcher
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-DNS-Switcher-debug-apk
          path: AIDnsSwitcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
